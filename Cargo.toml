[package]
name = "day-hub"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "dayapp"

[features]
default = ["mock"]
mock = ["day/mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
mdc = ["day/mdc"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]

[dependencies]
day = { git = "https://github.com/daybrite/day.git" }
day-part-http = { git = "https://github.com/daybrite/day.git" }
html5ever = "0.39"
day-piece-charts = { git = "https://github.com/daybrite/day-piece-charts.git" }
oauth2 = { version = "5", default-features = false }
graphql_client = { version = "0.16", default-features = false }
keyring = { version = "4.2", features = ["v1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-lock = "3"
httpdate = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
# keyring's v1 defaults select the legacy macOS Keychain feature; iOS requires
# the protected-data implementation even for fixture builds that never open it.
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
day-dom = { git = "https://github.com/daybrite/day.git" }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }

[workspace]
