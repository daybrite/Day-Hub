[package]
name = "day-hub"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "dayapp"

[features]
default = ["mock"]
mock = ["day/mock"]
appkit = ["day/appkit"]

[dependencies]
day = { git = "https://github.com/daybrite/day.git" }
day-part-http = { git = "https://github.com/daybrite/day.git" }
html5ever = "0.39"
day-piece-charts = { git = "https://github.com/daybrite/day-piece-charts.git" }
oauth2 = { version = "5", default-features = false }
graphql_client = { version = "0.16", default-features = false }
keyring = { version = "4.2", features = ["v1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-lock = "3"
httpdate = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }

[workspace]
