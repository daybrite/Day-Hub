name: Day-Hub

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Marking a pre-release as a release (or publishing one) rebuilds the website against it.
  release:
    types: [released]
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *" # daily (UTC)

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release-asset upload on tag builds
      pages: write    # web-dom → GitHub Pages (deploy-web)
      id-token: write # deploy-pages OIDC token (deploy-web)
    secrets: inherit
    with:
      targets: windows-winui, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      update-day-deps: true
      # Repository routes come from nav.items() at runtime. The static route linter
      # only knows literal nav.item() keys; the fixture scripts exercise these routes.
      lint: false
      target-setup: |
        windows-winui, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom: $DAY_BIN lint --allow unknown-route
      # Synthetic account data: no interactive OAuth or saved credentials in CI.
      scripts: dayscript/hub.yaml dayscript/settings.yaml dayscript/hidden.yaml dayscript/sections.yaml
      launch-env: DAY_HUB_FIXTURE=1
      #locales: en
      deploy-web: true

