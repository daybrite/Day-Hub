# Synthetic account fixture. Collapsing a section preserves the selected detail route.
flow:
  - wait_for: { id: nav_sections }
  # CI starts this flow in a fresh app, with Account covering the sidebar on iPhone.
  - nav_back: { native: true, only_on: [ios] }
  - wait_for: { id: "sidebar:header%3Aowner%3Afixture-org" }
  - navigate: { route: "repo:fixture-org~day" }
  - expand: { id: nav_sections, row: "sidebar:header%3Aowner%3Afixture-org", expanded: false }
  - assert_missing: { id: "sidebar:item%3Arepo%3Afixture-org~day" }
  - assert_route: { route: "repo:fixture-org~day/overview" }
  - wait_for: { id: repository_title }
  # On iPhone the detail covers the sidebar. Return before checking realized row ids.
  # Native back is a no-op on a wide iPad where the sidebar already remains visible.
  - nav_back: { native: true, only_on: [ios] }
  - expand: { id: nav_sections, row: "sidebar:header%3Aowner%3Afixture-org", expanded: true }
  - wait_for: { id: "sidebar:item%3Arepo%3Afixture-org~day" }
  - expand: { id: nav_sections, row: "sidebar:header%3Afavorites", expanded: false }
  - assert_missing: { id: "sidebar:item%3Afavorite%3Afixture-org~day" }
  - expand: { id: nav_sections, row: "sidebar:header%3Afavorites", expanded: true }
  - screenshot: { name: repository-sections }
