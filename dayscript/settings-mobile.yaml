# Run with DAY_HUB_FIXTURE=1 on mobile. Settings is a sidebar section that pushes one
# page per group; fixture mode keeps every preference in memory.
flow:
  - wait_for: { id: hub_nav }
  # A previous flow can leave a remembered group. Enter a known group, then pop to root.
  - navigate: { route: settings/general }
  - wait_for: { id: language_picker }
  - nav_back: {}
  # On compact iOS the stack merges into the sidebar host, sharing its root node's id.
  # The General row identifies the root page on both merged and standalone stacks.
  - wait_for: { id: prefs_group:general }
  - assert_route: { route: settings }
  - screenshot: { name: settings }
  # Leave the settings section before each `settings/<group>` route: an absolute route into
  # the section that is already current trips a day-core nav bug (navigate_absolute removes
  # a pending segment the stack already consumed) and stalls the main thread.
  - navigate: { route: account }
  - navigate: { route: settings/general }
  - wait_for: { id: language_picker }
  - navigate: { route: account }
  - navigate: { route: settings/grid }
  - wait_for: { id: menu_repository_order }
  - select: { id: menu_repository_order, index: 1 }
  - assert_value: { id: menu_repository_order, value: 1 }
  - toggle: { id: show_grid, value: false }
  - assert_value: { id: show_grid, value: false }
  - toggle: { id: show_grid, value: true }
  # UIKit's grouped settings table owns scrolling natively; it has no Day scroll ancestor.
  - scroll_to: { id: grid_preview, only_on: [android, harmony] }
  - assert_visible: { id: grid_preview }
  - screenshot: { name: grid-settings }
  - navigate: { route: account }
  - navigate: { route: settings/repositories }
  - wait_for: { id: monitor_rows }
  - select: { id: monitor_rows, index: 1 }
  - tap: { id: monitor_remove_selected }
  - assert_text: { id: monitor_row_count, key: editor_count, args: { count: 2 } }
  - navigate: { route: account }
  - assert_text: { id: github_account, text: "Signed in as fixture-user" }
  # The edit was saved, not held in a draft.
  - navigate: { route: settings/repositories }
  - wait_for: { id: monitor_rows }
  - assert_text: { id: monitor_row_count, key: editor_count, args: { count: 2 } }
  - navigate: { route: account }
  - navigate: { route: settings/grid }
  - wait_for: { id: menu_repository_order }
  - assert_value: { id: menu_repository_order, value: 1 }
  - navigate: { route: account }
