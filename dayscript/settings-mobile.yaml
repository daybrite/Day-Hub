# Run with DAY_HUB_FIXTURE=1 on mobile. Changes remain in the draft.
flow:
  - wait_for: { id: hub-nav }
  - navigate: { route: settings }
  - wait_for: { id: settings-page }
  - assert_route: { route: settings }
  - select: { id: menu-repository-order, index: 1 }
  - assert_value: { id: menu-repository-order, value: 1 }
  - toggle: { id: show-grid, value: false }
  - assert_value: { id: show-grid, value: false }
  - toggle: { id: show-grid, value: true }
  - scroll_to: { id: monitor-rows }
  - select: { id: monitor-rows, index: 1 }
  - tap: { id: monitor-remove-selected }
  - assert_text: { id: monitor-row-count, key: editor_count, args: { count: 2 } }
  - screenshot: { name: mobile-settings }
  - navigate: { route: account }
  - assert_text: { id: github-account, text: "Signed in as fixture-user" }
  - navigate: { route: settings }
  - assert_text: { id: monitor-row-count, key: editor_count, args: { count: 3 } }
