# Synthetic account and local visibility state; no Keychain or persisted preference edits.
flow:
  - wait_for: { id: hub_nav }
  - assert_text: { id: sidebar_repository_count, text: "2 of 2 repositories shown" }
  - navigate: { route: "repo:fixture-org~day" }
  - context_menu: { id: repository_title, item_id: toggle_hidden_repository }
  - assert_text: { id: sidebar_repository_count, text: "1 of 2 repositories shown" }
  - menu: { id: toggle_hidden_repositories }
  - assert_text: { id: sidebar_repository_count, text: "2 of 2 repositories shown" }
  - navigate: { route: "repo:fixture-org~day" }
  - context_menu: { id: repository_title, item_id: toggle_hidden_repository }
  - menu: { id: toggle_hidden_repositories }
  - assert_text: { id: sidebar_repository_count, text: "2 of 2 repositories shown" }
  - navigate: { route: "repo:fixture-org~day" }
  - context_menu: { id: repository_title, item_id: toggle_hidden_owner }
  - assert_text: { id: sidebar_repository_count, text: "1 of 2 repositories shown" }
  - menu: { id: toggle_hidden_repositories }
  - assert_text: { id: sidebar_repository_count, text: "2 of 2 repositories shown" }
  - screenshot: { name: hidden-repositories }
  - navigate: { route: "repo:fixture-org~day" }
  - context_menu: { id: repository_title, item_id: toggle_hidden_owner }
  - menu: { id: toggle_hidden_repositories }
  - assert_text: { id: sidebar_repository_count, text: "2 of 2 repositories shown" }
