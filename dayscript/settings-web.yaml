# Web exposes Settings through its app-menu cover. DAY_HUB_FIXTURE=1 keeps preferences
# in memory. Dismiss the cover before asserting the workspace's navigation route.
flow:
  - wait_for: { id: hub_nav }
  - assert_missing: { id: "sidebar:item%3Asettings" }
  - navigate: { route: account }
  # Opening remembers the last group; explicitly visit General before returning to root.
  - navigate: { route: settings/general }
  - wait_for: { id: language_picker }
  - nav_back: {}
  - wait_for: { id: prefs_group:general }
  - screenshot: { name: settings }
  - tap: { id: prefs_group:grid }
  - wait_for: { id: menu_repository_order }
  - select: { id: menu_repository_order, index: 1 }
  - assert_value: { id: menu_repository_order, value: 1 }
  - toggle: { id: show_grid, value: false }
  - assert_value: { id: show_grid, value: false }
  - toggle: { id: show_grid, value: true }
  - scroll_to: { id: grid_preview }
  - assert_visible: { id: grid_preview }
  - screenshot: { name: grid-settings }
  - nav_back: {}
  - tap: { id: prefs_group:repositories }
  - wait_for: { id: monitor_rows }
  - select: { id: monitor_rows, index: 1 }
  - tap: { id: monitor_remove_selected }
  - assert_text: { id: monitor_row_count, key: editor_count, args: { count: 2 } }
  - toolbar: { item: settings_done }
  - assert_missing: { id: monitor_rows }
  - assert_route: { route: account }
  - assert_text: { id: github_account, text: "Signed in as fixture-user" }
  # The app-menu entry reopens the remembered group with its saved values.
  - navigate: { route: settings }
  - wait_for: { id: monitor_rows }
  - assert_text: { id: monitor_row_count, key: editor_count, args: { count: 2 } }
  - nav_back: {}
  - tap: { id: prefs_group:grid }
  - wait_for: { id: menu_repository_order }
  - assert_value: { id: menu_repository_order, value: 1 }
  - toolbar: { item: settings_done }
  - assert_missing: { id: menu_repository_order }
  - assert_route: { route: account }
