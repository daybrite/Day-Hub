# Run with DAY_HUB_FIXTURE=1. Synthetic account data; no OAuth, Keychain reads or network.
# Fixture mode keeps every preference in memory: this flow never changes the user's list.
flow:
  - wait_for: { id: hub_nav }
  - assert_text: { id: github_account, text: "Signed in as fixture-user" }
  - assert_text: { id: repository_count, text: "2 accessible repositories" }
  - screenshot: { name: account }
  - navigate: { route: "repo:fixture-org~day" }
  - wait_for: { id: language_chart }
  - screenshot: { name: repository-overview }
  - navigate: { route: "repo:fixture-org~day/actions" }
  - wait_for: { id: run_chart }
  - tap: { id: run:100 }
  - wait_for: { id: run_jobs }
  - scroll_to: { id: run_jobs }
  - screenshot: { name: repository-actions }
  - navigate: { route: settings/repositories }
  - wait_for: { id: monitor_rows }
  - input: { id: known_repository_search, text: "fixture-org/day" }
  # AppKit only realizes visible list rows. CI's smaller display can put this list below
  # the Settings window's viewport, so reveal it before looking up a row's Add button.
  - scroll_to: { id: known_repositories, only_on: [macos, ios, android, harmony, web] }
  - tap: { id: known_add:1 }
  - assert_text: { id: monitor_row_count, key: editor_count, args: { count: 4 } }
  - assert_missing: { id: known_add:1 }
  - scroll_to: { id: monitor_rows, only_on: [macos, ios, android, harmony, web] }
  - context_menu: { id: monitor_row:fixture-org~day, item_id: monitor_remove }
  - assert_missing: { id: monitor_row:fixture-org~day }
  - input: { id: monitor_input, text: "fixture/../invalid" }
  - tap: { id: monitor_add }
  - assert_text: { id: monitor_message, key: invalid_repository, args: { line: "1" } }
  - input: { id: monitor_input, text: "fixture/new" }
  - tap: { id: monitor_add }
  - tap: { id: monitor_separator }
  - reorder: { id: monitor_rows, from: 1, to: 2 }
  - scroll_to: { id: monitor_rows, only_on: [macos, ios, android, harmony, web] }
  - context_menu: { id: monitor_row:separator-1, item_id: monitor_remove }
  - assert_missing: { id: monitor_row:separator-1 }
  - scroll_to: { id: monitor_rows, only_on: [macos, ios, android, harmony, web] }
  - select: { id: monitor_rows, index: 2 }
  - tap: { id: monitor_remove_selected }
  - assert_missing: { id: monitor_row:fixture~new }
  - assert_text: { id: monitor_row_count, key: editor_count, args: { count: 3 } }
  - screenshot: { name: monitor-editor, window: day.preferences, only_on: [macos, windows, linux] }
  - screenshot: { name: monitor-editor, only_on: [ios, android, harmony, web] }
  # Web Settings is a cover registered under the same window key; dismiss it before
  # continuing in the main workspace so its navigation stack does not remain active.
  - close_window: { window: day.preferences, only_on: [macos, windows, linux, web] }
  - navigate: { route: account }
  - assert_text: { id: github_account, text: "Signed in as fixture-user" }
